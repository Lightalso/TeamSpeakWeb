<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#131722" />
  <title>TeamSpeak Web</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (() => {
      let mode = "auto";
      try {
        const saved = localStorage.getItem("tsweb_theme");
        if (["auto", "light", "dark"].includes(saved)) mode = saved;
      } catch (_) {}
      const effective = mode === "auto"
        ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.dataset.theme = effective;
      let language = "en";
      try {
        const savedLanguage = localStorage.getItem("tsweb_language");
        if (["en", "zh"].includes(savedLanguage)) language = savedLanguage;
      } catch (_) {}
      document.documentElement.dataset.language = language;
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Connect screen -->
    <section id="connect-screen" class="screen">
      <div class="card connect-card">
        <div class="connect-header">
          <div class="brand-lockup">
            <div><h1>TeamSpeak Web</h1><span class="brand-caption" data-i18n="brand.caption">Browser voice client</span></div>
          </div>
          <div class="header-actions">
            <button class="language-toggle" type="button" data-language-toggle><span data-language-label>EN</span></button>
            <button class="theme-toggle" type="button" data-theme-toggle>
              <span class="theme-icon" data-theme-icon aria-hidden="true">◐</span>
              <span data-theme-label>Auto</span>
            </button>
          </div>
        </div>
        <form id="connect-form">
          <label class="field-wide">
            <span data-i18n="connect.address">Server address</span>
            <input id="f-addr" type="text" placeholder="ts.example.com:9987" data-i18n-placeholder="connect.address_placeholder" required />
          </label>
          <label>
            <span data-i18n="connect.nickname">Nickname</span>
            <input id="f-nickname" type="text" placeholder="Guest" data-i18n-placeholder="connect.nickname_placeholder" maxlength="30" />
          </label>
          <label>
            <span><span data-i18n="connect.server_password">Server password</span> <span class="muted" data-i18n="common.optional">(optional)</span></span>
            <input id="f-password" type="password" placeholder="" />
          </label>
          <details class="advanced-options field-wide">
            <summary data-i18n="connect.advanced">Advanced options</summary>
            <div class="advanced-fields">
              <label>
                <span><span data-i18n="connect.default_channel">Default channel</span> <span class="muted" data-i18n="common.optional">(optional)</span></span>
                <input id="f-channel" type="text" placeholder="Lobby" data-i18n-placeholder="connect.channel_placeholder" />
              </label>
              <label>
                <span><span data-i18n="connect.channel_password">Channel password</span> <span class="muted" data-i18n="common.optional">(optional)</span></span>
                <input id="f-channelpw" type="password" placeholder="" />
              </label>
            </div>
          </details>
          <div class="connect-actions field-wide">
            <button type="submit" id="connect-btn" class="btn-primary" data-i18n="connect.button">Connect</button>
            <p id="connect-error" class="error hidden" role="alert"></p>
          </div>
        </form>
      </div>
    </section>

    <!-- Main client view -->
    <section id="main-screen" class="screen hidden">
      <nav class="navbar">
        <div class="nav-primary">
          <div class="server-status" id="server-status">
            <span class="brand" id="server-name">—</span>
          </div>
        </div>
        <div class="nav-actions">
          <button class="language-toggle compact" type="button" data-language-toggle><span data-language-label>EN</span></button>
          <button class="theme-toggle compact" type="button" data-theme-toggle>
            <span class="theme-icon" data-theme-icon aria-hidden="true">◐</span>
            <span data-theme-label>Auto</span>
          </button>
          <button id="disconnect-btn" class="btn danger" data-i18n="action.disconnect">Disconnect</button>
        </div>
      </nav>

      <div class="mobile-tabs" id="mobile-tabs">
        <button class="mobile-tab active" data-panel="channels-panel" type="button" data-i18n="nav.channels">Channels</button>
        <button class="mobile-tab" data-panel="clients-panel" type="button" data-i18n="nav.clients">Clients</button>
        <button class="mobile-tab" data-panel="chat-panel" type="button" data-i18n="nav.chat">Chat</button>
      </div>

      <div class="layout">
        <aside class="panel channels-panel active">
          <div class="panel-heading"><h2 data-i18n="nav.channels">Channels</h2></div>
          <div id="channel-tree" class="channel-tree"></div>
        </aside>

        <main class="panel clients-panel">
          <div class="panel-heading"><h2 id="selected-channel-title" data-i18n="nav.clients">Clients</h2></div>
          <button id="join-btn" class="btn mobile-join-button" disabled data-i18n="action.join">Join</button>
          <div id="client-list" class="client-list"></div>
        </main>

        <aside class="panel chat-panel">
          <div class="panel-heading"><h2 data-i18n="nav.chat">Chat</h2></div>
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form">
            <input id="chat-input" type="text" placeholder="Message channel…" data-i18n-placeholder="chat.placeholder" autocomplete="off" />
            <button type="submit" class="btn" data-i18n="chat.send">Send</button>
          </form>
        </aside>
      </div>

      <div class="voice-bar">
        <div class="voice-controls">
          <button id="mic-btn" class="btn-voice mic-mode-button" type="button" aria-live="polite">Mic on</button>
        </div>
        <div class="meter-group">
          <label class="meter volume-control" for="mic-volume">
            <span class="meter-label" data-i18n="audio.mic_short">Mic</span>
            <span class="volume-slider">
              <span class="meter-track" aria-hidden="true"><span id="mic-meter" class="meter-fill"></span></span>
              <input id="mic-volume" type="range" min="0" max="200" step="5" value="100" aria-label="Microphone volume" data-i18n-aria="audio.mic_volume" />
            </span>
            <output id="mic-volume-value" for="mic-volume">100%</output>
          </label>
          <label class="meter volume-control" for="output-volume">
            <span class="meter-label" data-i18n="audio.out_short">Out</span>
            <span class="volume-slider">
              <span class="meter-track" aria-hidden="true"><span id="out-meter" class="meter-fill"></span></span>
              <input id="output-volume" type="range" min="0" max="200" step="5" value="100" aria-label="Master output volume" data-i18n-aria="audio.output_volume" />
            </span>
            <output id="output-volume-value" for="output-volume">100%</output>
          </label>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
